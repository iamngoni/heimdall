{% extends "base.html" %}
{% block title %}{{ error_title }}{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center py-24">
    <p class="text-6xl font-bold text-gray-600">{{ error_code }}</p>
    <h1 class="mt-4 text-xl font-semibold text-white">{{ error_title }}</h1>
    <p class="mt-2 text-sm text-gray-400">{{ error_message }}</p>
    <a href="/" class="mt-6 rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500 transition-colors">Back to Dashboard</a>
</div>
{% endblock %}
