<div class="flex flex-col gap-3 border-b border-ink-200 py-4 lg:flex-row lg:items-center lg:justify-between" id="key-{{ key.id }}">
    <div>
        <p class="text-sm text-ink-900">{{ key.provider|capitalize }}{% if key.label %} · {{ key.label }}{% endif %}</p>
        <p class="mt-1 font-mono text-[11px] uppercase tracking-[0.16em] text-ink-400">Created {{ key.created_at }}</p>
    </div>
    <button hx-delete="/api/settings/api-keys/{{ key.id }}"
            hx-target="#key-{{ key.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this API key?"
            class="inline-flex items-center border-b border-transparent pb-1 text-sm text-red-700 transition hover:border-red-700">
        Delete
    </button>
</div>
