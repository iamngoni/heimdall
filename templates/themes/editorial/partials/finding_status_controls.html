<div id="finding-status" class="border-y border-ink-200 py-8"
     hx-on::after-swap="if(window.HeimdallUI){window.HeimdallUI.success('Finding status updated to ' + '{{ finding.status }}'.replace('_',' '), 3000)}">
    <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
        <div>
            <p class="section-num">Status</p>
            <div class="mt-3 flex items-center gap-4">
                <span class="inline-flex items-center gap-2 text-base capitalize
                    {{ 'text-ink-900' if finding.status == 'confirmed' else
                       'text-red-700' if finding.status == 'open' else
                       'text-amber-700' if finding.status == 'false_positive' else
                       'text-ink-400' if finding.status == 'dismissed' else
                       'text-ink-900' if finding.status == 'fixed' else
                       'text-ink-500' }}">
                    <span class="h-2 w-2 rounded-full
                        {{ 'bg-ink-900' if finding.status == 'confirmed' else
                           'bg-red-700' if finding.status == 'open' else
                           'bg-amber-700' if finding.status == 'false_positive' else
                           'bg-ink-300' if finding.status == 'dismissed' else
                           'bg-ink-900' if finding.status == 'fixed' else
                           'bg-ink-400' }}"></span>
                    {{ finding.status|replace("_", " ") }}
                </span>
                <p class="text-sm text-ink-500">Mark the triage decision below.</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm">
            <button hx-patch="/api/findings/{{ finding.id }}/status"
                    hx-target="#finding-status"
                    hx-swap="outerHTML"
                    hx-vals='{"status":"confirmed"}'
                    hx-indicator="#finding-status-loading"
                    class="inline-flex items-center gap-2 border-b pb-1 transition {{ 'border-ink-900 text-ink-900' if finding.status == 'confirmed' else 'border-transparent text-ink-600 hover:border-ink-900 hover:text-ink-900' }}">
                <span>Accept</span>
                <span class="htmx-indicator-inline items-center gap-1 text-ink-400">
                    <svg class="h-3 w-3 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" class="opacity-20" stroke="currentColor" stroke-width="2"></circle>
                        <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </span>
            </button>
            <button hx-patch="/api/findings/{{ finding.id }}/status"
                    hx-target="#finding-status"
                    hx-swap="outerHTML"
                    hx-vals='{"status":"dismissed"}'
                    hx-indicator="#finding-status-loading"
                    class="inline-flex items-center gap-2 border-b pb-1 transition {{ 'border-ink-900 text-ink-900' if finding.status == 'dismissed' else 'border-transparent text-ink-600 hover:border-ink-900 hover:text-ink-900' }}">
                <span>Dismiss</span>
                <span class="htmx-indicator-inline items-center gap-1 text-ink-400">
                    <svg class="h-3 w-3 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" class="opacity-20" stroke="currentColor" stroke-width="2"></circle>
                        <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </span>
            </button>
            <button hx-patch="/api/findings/{{ finding.id }}/status"
                    hx-target="#finding-status"
                    hx-swap="outerHTML"
                    hx-vals='{"status":"false_positive"}'
                    hx-indicator="#finding-status-loading"
                    class="inline-flex items-center gap-2 border-b pb-1 transition {{ 'border-amber-700 text-amber-700' if finding.status == 'false_positive' else 'border-transparent text-ink-600 hover:border-amber-700 hover:text-amber-700' }}">
                <span>False Positive</span>
                <span class="htmx-indicator-inline items-center gap-1 text-ink-400">
                    <svg class="h-3 w-3 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" class="opacity-20" stroke="currentColor" stroke-width="2"></circle>
                        <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </span>
            </button>
            <button hx-patch="/api/findings/{{ finding.id }}/status"
                    hx-target="#finding-status"
                    hx-swap="outerHTML"
                    hx-vals='{"status":"fixed"}'
                    hx-indicator="#finding-status-loading"
                    class="inline-flex items-center gap-2 border-b pb-1 transition {{ 'border-ink-900 text-ink-900' if finding.status == 'fixed' else 'border-transparent text-ink-600 hover:border-ink-900 hover:text-ink-900' }}">
                <span>Mark Fixed</span>
                <span class="htmx-indicator-inline items-center gap-1 text-ink-400">
                    <svg class="h-3 w-3 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" class="opacity-20" stroke="currentColor" stroke-width="2"></circle>
                        <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                    </svg>
                </span>
            </button>
        </div>
    </div>

    <div id="finding-status-loading"
         class="htmx-indicator-flex mt-6 items-start gap-3 border-t border-ink-200 pt-4 text-ink-700">
        <svg class="mt-0.5 h-4 w-4 animate-spin text-ink-500" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" class="opacity-20" stroke="currentColor" stroke-width="2"></circle>
            <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <div>
            <p class="text-sm text-ink-900">Updating finding status</p>
            <p class="mt-1 text-sm leading-6 text-ink-500">
                Recording the triage decision and refreshing the activity timeline.
            </p>
        </div>
    </div>
</div>
