<aside class="sticky top-0 self-start flex h-screen w-[272px] shrink-0 flex-col overflow-y-auto border-r"
       style="background:var(--hm-shell-alt);border-color:rgba(255,255,255,0.05)">
    <div class="relative flex min-h-full flex-1 flex-col px-4 py-5">
        <div class="absolute inset-y-0 left-0 w-px" style="background:rgba(230,165,154,0.24)"></div>

        <a href="/"
           class="flex items-center gap-3 rounded-2xl px-3.5 py-3 transition hover:bg-[rgba(255,255,255,0.04)]"
           aria-label="Heimdall home"
           style="color:var(--hm-text-900)">
            <span class="flex h-9 w-9 items-center justify-center rounded-xl text-[13px] font-semibold"
                  style="background:rgba(255,255,255,0.06);color:var(--hm-text-900)">H</span>
            <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-semibold" style="color:var(--hm-text-900)">Heimdall</p>
                <p class="mt-0.5 truncate text-[11px]" style="color:var(--hm-text-500)">Security workspace</p>
            </div>
        </a>

        <div class="mt-6 border-t pt-5" style="border-color:var(--hm-border)">
            <p class="px-3 text-[10px] font-semibold uppercase tracking-[0.22em]" style="color:var(--hm-text-500)">Navigation</p>

            <nav class="mt-3 space-y-0.5">
                <a href="/"
                   class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition hover:bg-[rgba(255,255,255,0.04)]"
                   style="background:{{ 'rgba(255,255,255,0.05)' if active_nav == 'overview' else 'transparent' }};box-shadow:{{ 'inset 0 0 0 1px var(--hm-border)' if active_nav == 'overview' else 'none' }};color:{{ 'var(--hm-text-900)' if active_nav == 'overview' else 'var(--hm-text-600)' }}">
                    <span class="flex h-4 w-4 items-center justify-center transition"
                          style="color:{{ 'var(--hm-text-900)' if active_nav == 'overview' else 'var(--hm-text-500)' }}">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 8.25A1.75 1.75 0 016.25 6.5h3.5A1.75 1.75 0 0111.5 8.25v3.5a1.75 1.75 0 01-1.75 1.75h-3.5A1.75 1.75 0 014.5 11.75v-3.5zM12.5 8.25A1.75 1.75 0 0114.25 6.5h3.5A1.75 1.75 0 0119.5 8.25v7.5a1.75 1.75 0 01-1.75 1.75h-3.5a1.75 1.75 0 01-1.75-1.75v-7.5zM4.5 15.75A1.75 1.75 0 016.25 14h3.5a1.75 1.75 0 011.75 1.75h0A1.75 1.75 0 019.75 17.5h-3.5A1.75 1.75 0 014.5 15.75h0z" />
                        </svg>
                    </span>
                    <span class="min-w-0 flex-1 truncate font-medium">Overview</span>
                    <span class="text-[11px] font-medium" style="color:{{ 'var(--hm-text-500)' if active_nav == 'overview' else 'var(--hm-text-400)' }}">01</span>
                </a>

                <a href="/repos"
                   class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition hover:bg-[rgba(255,255,255,0.04)]"
                   style="background:{{ 'rgba(255,255,255,0.05)' if active_nav == 'repos' else 'transparent' }};box-shadow:{{ 'inset 0 0 0 1px var(--hm-border)' if active_nav == 'repos' else 'none' }};color:{{ 'var(--hm-text-900)' if active_nav == 'repos' else 'var(--hm-text-600)' }}">
                    <span class="flex h-4 w-4 items-center justify-center transition"
                          style="color:{{ 'var(--hm-text-900)' if active_nav == 'repos' else 'var(--hm-text-500)' }}">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 6.75A2.25 2.25 0 009.75 9v6a2.25 2.25 0 102.25-2.25H18a2.25 2.25 0 100-4.5h-6A2.25 2.25 0 109.75 6h-2.25z" />
                            <circle cx="9.75" cy="6.75" r="1.25" fill="currentColor" stroke="none" />
                            <circle cx="18" cy="8.25" r="1.25" fill="currentColor" stroke="none" />
                            <circle cx="12" cy="15" r="1.25" fill="currentColor" stroke="none" />
                        </svg>
                    </span>
                    <span class="min-w-0 flex-1 truncate font-medium">Repositories</span>
                    <span class="text-[11px] font-medium" style="color:{{ 'var(--hm-text-500)' if active_nav == 'repos' else 'var(--hm-text-400)' }}">02</span>
                </a>
            </nav>
        </div>

        <div class="mt-auto border-t pt-5" style="border-color:var(--hm-border)">
            <p class="px-3 text-[10px] font-semibold uppercase tracking-[0.22em]" style="color:var(--hm-text-500)">System</p>

            <nav class="mt-3 space-y-0.5">
                <a href="/settings"
                   class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition hover:bg-[rgba(255,255,255,0.04)]"
                   style="background:{{ 'rgba(255,255,255,0.05)' if active_nav == 'settings' else 'transparent' }};box-shadow:{{ 'inset 0 0 0 1px var(--hm-border)' if active_nav == 'settings' else 'none' }};color:{{ 'var(--hm-text-900)' if active_nav == 'settings' else 'var(--hm-text-600)' }}">
                    <span class="flex h-4 w-4 items-center justify-center transition"
                          style="color:{{ 'var(--hm-text-900)' if active_nav == 'settings' else 'var(--hm-text-500)' }}">
                        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a5.25 5.25 0 100 10.5 5.25 5.25 0 000-10.5z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06A1.65 1.65 0 0015 19.4a1.65 1.65 0 00-1 .6 1.65 1.65 0 01-2 0 1.65 1.65 0 00-1-.6 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-.6-1 1.65 1.65 0 010-2 1.65 1.65 0 00.6-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-.6 1.65 1.65 0 012 0 1.65 1.65 0 001 .6 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.23.37.37.78.37 1.2s-.14.83-.37 1.2c-.23.37-.35.79-.35 1.23s.12.86.35 1.23z" />
                        </svg>
                    </span>
                    <span class="min-w-0 flex-1 truncate font-medium">Settings</span>
                    <span class="text-[11px] font-medium" style="color:{{ 'var(--hm-text-500)' if active_nav == 'settings' else 'var(--hm-text-400)' }}">03</span>
                </a>
            </nav>

            <div class="mt-5 flex items-center gap-3 px-3">
                <span class="flex h-8 w-8 items-center justify-center rounded-full text-[12px] font-semibold"
                      style="background:rgba(255,255,255,0.06);color:var(--hm-text-900)">{{ user_initial | default('?') }}</span>
                <div class="min-w-0">
                    <p class="truncate text-sm font-medium" style="color:var(--hm-text-900)">{{ user.display_name | default(user.email) | default('Signed in') }}</p>
                    <p class="truncate text-[11px]" style="color:var(--hm-text-500)">{{ user.email | default('') }}</p>
                </div>
            </div>
        </div>
    </div>
</aside>
