<header class="flex h-14 items-center border-b hm-oatmeal-rule bg-[rgba(15,19,24,0.84)] px-6">
    <div class="flex items-center gap-3 text-sm">
        <span class="font-semibold text-[color:var(--hm-text-900)]">Heimdall</span>
        <span class="text-[color:var(--hm-text-400)]">/</span>
        <span class="text-[color:var(--hm-text-600)]">{{ breadcrumb_parent }}</span>
        {% if breadcrumb_current %}
        <span class="text-[color:var(--hm-text-400)]">/</span>
        <span class="font-medium text-[color:var(--hm-text-900)]">{{ breadcrumb_current }}</span>
        {% endif %}
    </div>

    <div class="relative ml-auto">
        <details>
            <summary class="app-menu-summary flex list-none cursor-pointer items-center gap-2 rounded-full border border-transparent px-2 py-1 transition hover:border-[color:var(--hm-border)] hover:bg-[rgba(198,210,219,0.06)] focus:outline-none">
                <div class="flex h-8 w-8 items-center justify-center rounded-full text-xs font-semibold shadow-sm" style="background-color: var(--mist-100); color: var(--mist-950);">
                    {{ user_initial }}
                </div>
                <svg class="h-4 w-4 text-[color:var(--hm-text-500)]" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </summary>

            <div style="width: 18rem;" class="hm-oatmeal-panel absolute right-0 top-full z-30 mt-2 overflow-hidden rounded-2xl p-2">
                <div class="border-b hm-oatmeal-rule px-4 py-4">
                    <p class="text-xs font-semibold uppercase tracking-[0.14em] text-[color:var(--hm-text-500)]">Account</p>
                    <p class="mt-1 text-sm font-medium text-[color:var(--hm-text-900)]">Workspace controls</p>
                </div>

                <div class="mt-2 space-y-1">
                    <a href="/settings"
                       class="flex items-center justify-between rounded-2xl px-4 py-3 text-sm font-medium text-[color:var(--hm-text-700)] transition hover:bg-[rgba(198,210,219,0.06)] hover:text-[color:var(--hm-text-900)]">
                        <span>Settings</span>
                        <svg class="h-4 w-4 text-[color:var(--hm-text-400)]" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <path d="M8 6l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </a>

                    <button hx-post="/api/auth/logout"
                            hx-disabled-elt="this"
                            class="flex w-full items-center justify-between rounded-2xl px-4 py-3 text-left text-sm font-medium text-rose-700 transition hover:bg-[rgba(134,78,86,0.18)] disabled:cursor-not-allowed disabled:opacity-70">
                        <span>Sign Out</span>
                        <svg class="h-4 w-4 text-rose-300" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <path d="M12 6l-4 4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </details>
    </div>
</header>
