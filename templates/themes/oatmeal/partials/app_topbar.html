<header class="flex h-14 items-center border-b hm-oatmeal-rule px-6"
        style="background:transparent">
    <div class="flex items-center gap-3 text-sm">
        <span class="font-semibold text-[color:var(--hm-text-900)]">Heimdall</span>
        <span class="text-[color:var(--hm-text-400)]">/</span>
        <span class="text-[color:var(--hm-text-600)]">{{ breadcrumb_parent }}</span>
        {% if breadcrumb_current %}
        <span class="text-[color:var(--hm-text-400)]">/</span>
        <span class="font-medium text-[color:var(--hm-text-900)]">{{ breadcrumb_current }}</span>
        {% endif %}
    </div>

    <div class="relative ml-auto">
        <details>
            <summary class="app-menu-summary flex list-none cursor-pointer items-center rounded-full p-0 transition hover:opacity-90 focus:outline-none">
                <div class="flex h-8 w-8 items-center justify-center rounded-full text-xs font-semibold" style="background-color: rgba(255,255,255,0.06); color: var(--hm-text-900);">
                    {{ user_initial }}
                </div>
            </summary>

            <div class="absolute right-0 top-full z-30 mt-3 min-w-[14rem] overflow-hidden rounded-2xl border p-2"
                 style="border-color:var(--hm-border);background:var(--hm-shell-alt)">
                <div class="px-3 py-3">
                    <p class="text-[10px] font-semibold uppercase tracking-[0.18em]" style="color:var(--hm-text-500)">Account</p>
                    <p class="mt-1 text-sm font-medium" style="color:var(--hm-text-900)">{{ user.display_name | default(user.email) | default('Signed in') }}</p>
                </div>

                <div class="space-y-0.5 border-t pt-2" style="border-color:var(--hm-border)">
                    <a href="/settings"
                       class="flex items-center rounded-xl px-3 py-2.5 text-sm font-medium transition hover:bg-[rgba(255,255,255,0.04)]"
                       style="color:var(--hm-text-700)">
                        <span>Settings</span>
                    </a>

                    <button hx-post="/api/auth/logout"
                            hx-disabled-elt="this"
                            class="flex w-full items-center rounded-xl px-3 py-2.5 text-left text-sm font-medium transition hover:bg-[rgba(134,78,86,0.14)] disabled:cursor-not-allowed disabled:opacity-70"
                            style="color:var(--hm-danger-text)">
                        <span>Sign Out</span>
                    </button>
                </div>
            </div>
        </details>
    </div>
</header>
