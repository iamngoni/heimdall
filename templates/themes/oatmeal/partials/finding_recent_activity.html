<section id="finding-recent-activity" class="hm-oatmeal-panel p-5">
    <h2 class="hm-oatmeal-kicker">Recent Activity</h2>
    {% if events|length > 0 %}
    <div class="mt-4 space-y-3">
        {% for event in events %}
        <div class="hm-oatmeal-panel-soft px-4 py-3">
            <div class="flex items-start gap-3">
                <span class="mt-1 h-2.5 w-2.5 rounded-full"
                      style="background:{{ 'var(--hm-positive-text)' if event.tone == 'success' else
                                          'var(--hm-warning-text)' if event.tone == 'warning' else
                                          'var(--mist-700)' if event.tone == 'active' else
                                          'var(--hm-text-400)' }}">
                </span>
                <div class="min-w-0 flex-1">
                    <p class="text-sm font-semibold" style="color:var(--hm-text-900)">{{ event.title }}</p>
                    <p class="mt-1 text-sm leading-6" style="color:var(--hm-text-500)">{{ event.detail }}</p>
                </div>
            </div>
            <p class="mt-2 text-xs font-medium uppercase tracking-[0.12em]" style="color:var(--hm-text-400)">{{ event.created_at }}</p>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="hm-oatmeal-panel-outline mt-4 px-4 py-5 text-center text-sm">
        <p class="font-medium" style="color:var(--hm-text-600)">No activity yet</p>
        <p class="mt-1" style="color:var(--hm-text-400)">Status changes, AI reviews, and issue creation will be logged here.</p>
    </div>
    {% endif %}
</section>
