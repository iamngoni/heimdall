{% if severity == "critical" %}
<span class="hm-oatmeal-status hm-oatmeal-status-critical">
    <span class="hm-oatmeal-dot hm-oatmeal-dot-danger"></span>Critical
</span>
{% elif severity == "high" %}
<span class="hm-oatmeal-status hm-oatmeal-status-danger">
    <span class="hm-oatmeal-dot hm-oatmeal-dot-danger"></span>High
</span>
{% elif severity == "medium" %}
<span class="hm-oatmeal-status hm-oatmeal-status-warning">
    <span class="hm-oatmeal-dot hm-oatmeal-dot-warning"></span>Medium
</span>
{% elif severity == "low" %}
<span class="hm-oatmeal-status hm-oatmeal-status-neutral">
    <span class="hm-oatmeal-dot hm-oatmeal-dot-neutral"></span>Low
</span>
{% else %}
<span class="hm-oatmeal-status hm-oatmeal-status-neutral">{{ severity }}</span>
{% endif %}
