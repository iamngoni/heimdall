<section id="finding-recent-activity" class="hm-card p-5">
    <h2 class="text-xs font-semibold uppercase tracking-[0.12em] text-ink-500">Recent activity</h2>
    {% if events|length > 0 %}
    <div class="mt-3.5 space-y-2.5">
        {% for event in events %}
        <div class="flex items-start justify-between gap-3 rounded-lg border border-ink-200 bg-ink-50 px-3.5 py-3">
            <div class="flex items-start gap-2.5">
                <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full
                    {{ 'bg-low-500' if event.tone == 'success' else
                       'bg-med-500' if event.tone == 'warning' else
                       'bg-brand-500' if event.tone == 'active' else
                       'bg-ink-400' }}">
                </span>
                <div class="min-w-0">
                    <p class="text-sm font-medium text-ink-900">{{ event.title }}</p>
                    <p class="mt-0.5 text-sm leading-6 text-ink-500">{{ event.detail }}</p>
                </div>
            </div>
            <p class="shrink-0 whitespace-nowrap text-xs font-medium text-ink-400">{{ event.created_at }}</p>
        </div>
        {% endfor %}
    </div>
    <button type="button" class="mt-3 text-sm font-semibold text-brand-600 hover:text-brand-700">View all activity</button>
    {% else %}
    <div class="mt-3.5 rounded-lg border border-dashed border-ink-200 px-4 py-5 text-center text-sm">
        <p class="font-medium text-ink-600">No activity yet</p>
        <p class="mt-1 text-ink-400">Status changes, AI reviews, and issue creation will be logged here.</p>
    </div>
    {% endif %}
</section>
