<div class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-4 lg:flex-row lg:items-center lg:justify-between" id="key-{{ key.id }}">
    <div>
        <p class="text-sm font-semibold text-slate-900">{{ key.provider_label or key.provider|capitalize }}{% if key.label %} · {{ key.label }}{% endif %}</p>
        <p class="mt-1 text-xs text-slate-500">Created {{ key.created_at }}</p>
    </div>
    <button hx-delete="/api/settings/api-keys/{{ key.id }}"
            hx-target="#key-{{ key.id }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this API key?"
            class="inline-flex items-center justify-center rounded-xl border border-rose-200 bg-white px-4 py-2.5 text-sm font-semibold text-rose-700 transition hover:bg-rose-50">
        Delete
    </button>
</div>
