<section id="finding-recent-activity">
    <p class="section-num">Recent Activity</p>
    {% if events|length > 0 %}
    <ul class="mt-4 divide-y divide-ink-200">
        {% for event in events %}
        <li class="py-4">
            <div class="flex items-start gap-3">
                <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full
                    {{ 'bg-ink-900' if event.tone == 'success' else
                       'bg-amber-700' if event.tone == 'warning' else
                       'bg-ink-900' if event.tone == 'active' else
                       'bg-ink-400' }}">
                </span>
                <div class="min-w-0 flex-1">
                    <p class="text-sm text-ink-900">{{ event.title }}</p>
                    <p class="mt-1 text-sm leading-6 text-ink-500">{{ event.detail }}</p>
                    <p class="mt-2 font-mono text-[10px] uppercase tracking-[0.16em] text-ink-400">{{ event.created_at }}</p>
                </div>
            </div>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <div class="mt-4 border border-dashed border-ink-200 px-4 py-5 text-center text-sm">
        <p class="text-ink-900">No activity yet</p>
        <p class="mt-1 text-ink-400">Status changes, AI reviews, and issue creation will be logged here.</p>
    </div>
    {% endif %}
</section>
