{% if total_pages > 1 %}
<nav class="flex items-center justify-between border-t border-gray-800 pt-4 mt-4">
    <div class="text-sm text-gray-400">
        Page {{ page }} of {{ total_pages }} ({{ total }} total)
    </div>
    <div class="flex space-x-2">
        {% if page > 1 %}
        <a href="?page={{ page - 1 }}&per_page={{ per_page }}"
           class="rounded-md border border-gray-700 px-3 py-1 text-sm text-gray-300 hover:bg-gray-800 transition-colors"
           hx-get="?page={{ page - 1 }}&per_page={{ per_page }}" hx-target="main" hx-swap="innerHTML" hx-push-url="true">
            Previous
        </a>
        {% endif %}
        {% if page < total_pages %}
        <a href="?page={{ page + 1 }}&per_page={{ per_page }}"
           class="rounded-md border border-gray-700 px-3 py-1 text-sm text-gray-300 hover:bg-gray-800 transition-colors"
           hx-get="?page={{ page + 1 }}&per_page={{ per_page }}" hx-target="main" hx-swap="innerHTML" hx-push-url="true">
            Next
        </a>
        {% endif %}
    </div>
</nav>
{% endif %}
