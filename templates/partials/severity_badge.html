{% if severity == "critical" %}
<span class="inline-flex items-center rounded-full bg-red-600/20 px-2.5 py-0.5 text-xs font-semibold text-red-400 ring-1 ring-inset ring-red-600/30">Critical</span>
{% elif severity == "high" %}
<span class="inline-flex items-center rounded-full bg-orange-500/20 px-2.5 py-0.5 text-xs font-semibold text-orange-400 ring-1 ring-inset ring-orange-500/30">High</span>
{% elif severity == "medium" %}
<span class="inline-flex items-center rounded-full bg-yellow-500/20 px-2.5 py-0.5 text-xs font-semibold text-yellow-400 ring-1 ring-inset ring-yellow-500/30">Medium</span>
{% elif severity == "low" %}
<span class="inline-flex items-center rounded-full bg-blue-400/20 px-2.5 py-0.5 text-xs font-semibold text-blue-400 ring-1 ring-inset ring-blue-400/30">Low</span>
{% else %}
<span class="inline-flex items-center rounded-full bg-gray-500/20 px-2.5 py-0.5 text-xs font-semibold text-gray-400 ring-1 ring-inset ring-gray-500/30">{{ severity }}</span>
{% endif %}
