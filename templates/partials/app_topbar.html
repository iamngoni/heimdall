<header class="flex h-14 items-center border-b border-ink-200 bg-white px-8">
    <div class="flex items-center gap-3 font-mono text-xs tracking-wide text-ink-500">
        <span class="text-ink-900">heimdall</span>
        <span class="text-ink-300">/</span>
        <span>{{ breadcrumb_parent|lower if breadcrumb_parent else "" }}</span>
        {% if breadcrumb_current %}
        <span class="text-ink-300">/</span>
        <span class="text-ink-900">{{ breadcrumb_current|lower }}</span>
        {% endif %}
    </div>

    <div class="relative ml-auto">
        <details>
            <summary class="app-menu-summary flex list-none cursor-pointer items-center gap-2 border border-transparent px-1 py-1 transition hover:border-ink-200">
                <div class="flex h-7 w-7 items-center justify-center border border-ink-900 text-[11px] font-semibold text-ink-900">
                    {{ user_initial }}
                </div>
                <svg class="h-3.5 w-3.5 text-ink-400" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </summary>

            <div style="width: 18rem;" class="absolute right-0 top-full z-30 mt-2 overflow-hidden border border-ink-200 bg-white">
                <div class="border-b border-ink-200 px-4 py-3">
                    <p class="font-mono text-[10px] uppercase tracking-[0.18em] text-ink-400">01 · Account</p>
                    <p class="mt-1 text-sm text-ink-900">Workspace controls</p>
                </div>

                <div class="py-1">
                    <a href="/settings"
                       class="flex items-center justify-between px-4 py-3 text-sm text-ink-700 transition hover:bg-ink-50 hover:text-ink-900">
                        <span>Settings</span>
                        <span class="text-ink-300">→</span>
                    </a>

                    <button hx-post="/api/auth/logout"
                            hx-disabled-elt="this"
                            class="flex w-full items-center justify-between px-4 py-3 text-left text-sm text-ink-900 transition hover:bg-ink-50 disabled:cursor-not-allowed disabled:opacity-70">
                        <span>Sign Out</span>
                        <span class="text-ink-300">→</span>
                    </button>
                </div>
            </div>
        </details>
    </div>
</header>
