services:
  heimdall:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DB_DRIVER: ${DB_DRIVER:-postgres}
    container_name: heimdall
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
      mongo:
        condition: service_healthy
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Required for Garmr sandbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Database services — activate with: docker compose --profile <db> up
  # Only one should be active at a time.
  # --------------------------------------------------------------------------

  postgres:
    image: postgres:17-alpine
    container_name: heimdall-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: heimdall
      POSTGRES_DB: heimdall
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdall"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: heimdall-mysql
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: heimdall
      MYSQL_DATABASE: heimdall
      MYSQL_USER: heimdall
      MYSQL_PASSWORD: heimdall
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: heimdall-mongo
    profiles: ["mongo"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: heimdall
      MONGO_INITDB_ROOT_PASSWORD: heimdall
      MONGO_INITDB_DATABASE: heimdall
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: Local Ollama for AI inference
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: heimdall-ollama
  #   profiles: ["ollama"]
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

volumes:
  postgres-data:
    driver: local
  mysql-data:
    driver: local
  mongo-data:
    driver: local
