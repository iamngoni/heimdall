services:
  heimdall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heimdall
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Required for Garmr sandbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MCP Server — activate with: docker compose --profile mcp up
  # Provides authenticated Streamable HTTP access for MCP clients that cannot
  # launch the binary directly over stdio. Set MCP_HTTP_AUTH_TOKEN in .env.
  # --------------------------------------------------------------------------

  heimdall-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heimdall-mcp
    profiles: ["mcp"]
    entrypoint: ["/app/heimdall-mcp"]
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "45637"
      MCP_HTTP_AUTH_TOKEN: "${MCP_HTTP_AUTH_TOKEN:-}"
    ports:
      - "${MCP_PORT:-45637}:45637"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -s -o /dev/null -w '%{http_code}' -H 'accept: application/json, text/event-stream' http://localhost:45637/mcp || true); [ \"$$code\" = \"400\" ]",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Database service — PostgreSQL is the only supported runtime database.
  # Override these values in .env for anything beyond local development.
  # --------------------------------------------------------------------------

  postgres:
    image: postgres:17-alpine
    container_name: heimdall-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heimdall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heimdall}
      POSTGRES_DB: ${POSTGRES_DB:-heimdall}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heimdall}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

