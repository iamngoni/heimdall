[package]
name = "heimdall"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[[bin]]
name = "heimdall"
path = "src/main.rs"

[[bin]]
name = "schema_gen"
path = "src/bin/schema_gen.rs"

[[bin]]
name = "heimdall-mcp"
path = "src/bin/mcp.rs"

[dependencies]
# Web
actix-web = "4"
actix-rt = "2"
actix-files = "0.6"
actix-cors = "0.7"
actix-governor = "0.8"

# Templates
minijinja = { version = "2", features = ["loader", "json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Logging
log = "0.4"
env_logger = "0.11"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v7", "serde"] }

# Validation
validator = { version = "0.19", features = ["derive"] }

# Environment
dotenvy = "0.15"

# Docker (Garmr)
bollard = "0.18"
tokio-stream = { version = "0.1", features = ["sync"] }

# AI HTTP clients
reqwest = { version = "0.12", features = ["json"] }

# Async trait
async-trait = "0.1"

# Password hashing
argon2 = "0.5"

# Crypto
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.22"

# Tree-sitter (AST parsing)
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"

# File uploads
actix-multipart = "0.7"
zip = "2"
tempfile = "3"
futures-util = "0.3"

# File system
walkdir = "2"

# Regex
regex = "1"

# Hex encoding (for content hashes)
hex = "0.4"

# Glob pattern matching
glob = "0.3"

# MCP (Model Context Protocol)
rmcp = { version = "0.1", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

# Streams (for SSE)
futures = "0.3"

# Random (for session tokens)
rand = "0.9"

# OAuth
oauth2 = "4.4"

[dev-dependencies]
actix-rt = "2"
actix-test = "0.1"
